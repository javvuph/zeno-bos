name: zeno
description: ZENO Business Operating System - A modular, industry-agnostic BOS.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5

  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0

  # Dependency Injection
  get_it: ^7.6.0

  # Networking & Sync
  dio: ^5.3.0
  connectivity_plus: ^5.0.0

  # UI & Icons
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  responsive_framework: ^1.1.0
  flutter_animate: ^4.5.0
  glassmorphism_ui: ^0.3.0

  # Enterprise Visualization
  syncfusion_flutter_charts: ^28.1.33
  syncfusion_flutter_treemap: ^28.1.33
  syncfusion_flutter_gauges: ^28.1.33
  fl_chart: ^1.2.0
  table_calendar: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0

  # Utils
  uuid: ^4.2.1
  json_annotation: ^4.8.0
  intl: ^0.20.3

  # AI
  google_generative_ai: ^0.4.0

  # Phase 1 Integrations
  upi_india: ^3.0.1
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.2
  mobile_scanner: ^5.2.3
  url_launcher: ^6.2.1
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  flutter_sms: ^3.0.1
  flutter_email_sender: ^6.0.3

  # Phase 3 Hardware & Sync
  geolocator: ^12.0.0
  local_auth: ^2.3.0
  workmanager: ^0.5.2
  firebase_messaging: ^15.0.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  isar_generator: ^3.1.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  # To be added: assets, fonts, etc.
